<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="535" viewBox="0 0 1180 535" role="img" aria-labelledby="title desc">
<title id="title">Evidence provenance from source freeze to manuscript claims</title>
<desc id="desc">Frozen source and protocol pass no-training preflight and qualification before acquisition. Immutable records are authenticated, scored, and analyzed. Qwen and Llama controlled-delay analyses, downstream and scheduler studies, and an outcome-excluded M4-Shield live qualification map to bounded claims.</desc>
