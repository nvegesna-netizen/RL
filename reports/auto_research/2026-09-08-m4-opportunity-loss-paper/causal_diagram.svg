<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">Causal structure of the controlled-release experiment</title>
<desc id="desc">Fixed model, family, and workload context affect cadence and pre-release opportunity. Randomized arm affects only controlled delay, which affects version advance, terminal delivery, and lost opportunity. Family is not a randomized exposure.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#37474f"/></marker>
  <style>.box{stroke-width:2;rx:10}.context{fill:#fff3e0;stroke:#b45309}.treat{fill:#e0f2fe;stroke:#0369a1}.outcome{fill:#ecfdf5;stroke:#047857}.measure{fill:#f5f3ff;stroke:#6d28d9}.txt{font:16px Helvetica,Arial,sans-serif;fill:#17212b;text-anchor:middle}.small{font:14px Helvetica,Arial,sans-serif;fill:#475569;text-anchor:middle}.edge{stroke:#37474f;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#6d28d9;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style>
</defs>
<rect width="100%" height="100%" fill="white"/>
<rect class="box context" x="25" y="50" width="155" height="55"/><text class="txt" x="102" y="83">Model scale</text>
<rect class="box context" x="25" y="145" width="155" height="55"/><text class="txt" x="102" y="178">Workload</text>
<rect class="box context" x="245" y="55" width="210" height="65"/><text class="txt" x="350" y="83">System cadence</text><text class="small" x="350" y="104">and execution context</text>
<rect class="box measure" x="245" y="170" width="210" height="65"/><text class="txt" x="350" y="198">Pre-release opportunity</text><text class="small" x="350" y="219">Q (measured before arm)</text>
<rect class="box treat" x="245" y="315" width="210" height="65"/><text class="txt" x="350" y="343">Randomized arm</text><text class="small" x="350" y="364">control or d5</text>
<rect class="box treat" x="515" y="315" width="180" height="65"/><text class="txt" x="605" y="343">Added release delay</text><text class="small" x="605" y="364">0 or 5 seconds</text>
<rect class="box outcome" x="515" y="80" width="195" height="65"/><text class="txt" x="612" y="108">Version advance /</text><text class="small" x="612" y="129">direct-chain break</text>
<rect class="box outcome" x="770" y="80" width="165" height="65"/><text class="txt" x="852" y="108">Terminal delivery</text><text class="small" x="852" y="129">disposition D</text>
<rect class="box outcome" x="970" y="180" width="125" height="65"/><text class="txt" x="1032" y="208">Lost</text><text class="small" x="1032" y="229">opportunity QD</text>
<rect class="box measure" x="770" y="315" width="165" height="65"/><text class="txt" x="852" y="343">Observer</text><text class="small" x="852" y="364">measurement only</text>
<path class="edge" d="M180 77 L245 82"/><path class="edge" d="M180 168 L245 100"/>
<path class="edge" d="M180 173 L245 198"/><path class="edge" d="M180 82 L245 187"/>
<path class="edge" d="M455 347 L515 347"/><path class="edge" d="M605 315 L610 145"/>
<path class="edge" d="M455 87 L515 105"/><path class="edge" d="M710 112 L770 112"/>
<path class="edge" d="M935 123 L988 180"/><path class="edge" d="M455 202 L970 212"/>
<path class="dash" d="M812 315 L420 235"/><path class="dash" d="M875 315 L875 145"/>
<text class="small" x="668" y="395">Randomization identifies the within-cell delay effect; model and workload are fixed contexts.</text>
</svg>
