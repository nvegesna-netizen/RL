# Systems-only OARS arm of the randomized OARS actuation qualification.
# This pair is excluded from all confirmatory scientific estimates.
defaults: grpo_math_1B_megatron_single_controller_m4_oars_shadow_contention_preflight.yaml

grpo:
  seed: 20261421

async_rl:
  lifecycle_audit_path: results/m4-oars-qualification-act/lifecycle.jsonl
  controlled_release_delay:
    seed: 20261423
    assignment_domain: m4-oars-qualification-pair-v1
  gradient_opportunity_audit:
    output_path: results/m4-oars-qualification-act/opportunity.jsonl
    observer_duty_path: results/m4-oars-qualification-act/observer-duty.json
  opportunity_at_risk_shadow:
    mode: act
    output_path: results/m4-oars-qualification-act/oars.jsonl

# This qualification is constrained to one live Ray node. Inherit the pinned
# TransferQueue package already present in the image instead of creating a
# redundant actor runtime environment that fetches it from GitHub.
data_plane:
  actor_runtime_env_mode: inherit_baked_single_node

logger:
  log_dir: results/m4-oars-qualification-act/metrics
