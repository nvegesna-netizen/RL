# Prospective cross-family M4 transport cell: Llama 3.2 1B / OpenMath.
# Do not launch without the frozen joint protocol and a terminal green preflight.
defaults: grpo_math_1B_megatron_single_controller_m4_opportunity_loss_followup.yaml

grpo:
  max_num_epochs: 1

policy:
  model_name: meta-llama/Llama-3.2-1B-Instruct
  tokenizer:
    name: meta-llama/Llama-3.2-1B-Instruct
  make_sequence_length_divisible_by: 1

async_rl:
  lifecycle_audit_path: results/m4-llama3p2-1b-openmath-family-transport/lifecycle.jsonl
  controlled_release_delay:
    seed: 20260929
    assignment_domain: m4-opportunity-loss-llama3p2-1b-openmath-family-transport-v1
  gradient_opportunity_audit:
    output_path: results/m4-llama3p2-1b-openmath-family-transport/opportunity.jsonl
    observer_duty_path: results/m4-llama3p2-1b-openmath-family-transport/observer-duty.json

logger:
  log_dir: results/m4-llama3p2-1b-openmath-family-transport/metrics
