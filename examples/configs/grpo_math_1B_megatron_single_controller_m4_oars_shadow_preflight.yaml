# One-shot systems preflight for the observation-only OARS wrapper.
# Weight-FIFO remains the sole acting sampler; this run is not an OARS outcome acquisition.
defaults: grpo_math_1B_megatron_single_controller_m4_llama3p2_1b_gsm8k_family_transport.yaml

grpo:
  max_num_steps: 64
  max_num_epochs: 2
  seed: 20261401

async_rl:
  sampler:
    name: weight_fifo
    max_staleness_versions: 1
  lifecycle_audit_path: results/m4-oars-shadow-preflight/lifecycle.jsonl
  controlled_release_delay:
    enabled: true
    seed: 20261403
    assignment_domain: m4-oars-shadow-preflight-v1
    arms:
      - label: neutral
        delay_seconds: 0.0
        mass: 1
  gradient_opportunity_audit:
    enabled: true
    output_path: results/m4-oars-shadow-preflight/opportunity.jsonl
    observer_duty_path: results/m4-oars-shadow-preflight/observer-duty.json
  lifecycle_derived_opportunity_audit:
    enabled: false
  opportunity_at_risk_shadow:
    enabled: true
    output_path: results/m4-oars-shadow-preflight/oars-shadow.jsonl
    service_budget_multiplier: 1.02
    max_candidate_groups: 25

logger:
  log_dir: results/m4-oars-shadow-preflight/metrics
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: false
