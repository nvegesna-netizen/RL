# SingleController variant of grpo_math_1B.yaml.
defaults: grpo_math_1B.yaml

# SC does not support validation yet.
grpo:
  val_period: 0

async_rl:
  sampler:
    name: in_order
    # How far generation may run ahead of the trainer.
    max_lookahead_versions: 1
    # Weight-FIFO only: set a positive ready-candidate watermark to delay FIFO
    # selection until a larger live choice set exists. Null preserves eager FIFO.
    # selection_candidate_watermark: null
  # Recompute generation KV caches after each weight update.
  recompute_kv_cache_after_weight_updates: false
  # Min ready groups the streaming trainer waits for before dispatching a batch.
  min_groups_for_streaming_train: ${grpo.num_prompts_per_step}
  # Cap on in-flight generate_and_push calls in the rollout pump.
  max_inflight_prompts: ${grpo.num_prompts_per_step}
  # Cap on unconsumed rollout groups buffered in the DataPlane (backpressure).
  max_buffered_rollouts: 64
  # Enable per-rollout diagnostic prints (prompt content / completion previews).
  diagnostics: false
  # Default-off controlled delay between final sibling completion and release.
  controlled_release_delay:
    enabled: false
    seed: 20260808
    assignment_domain: m3-release-v2
    arms:
      - label: control
        delay_seconds: 0.0
        mass: 4
      - label: d30
        delay_seconds: 30.0
        mass: 1
      - label: d60
        delay_seconds: 60.0
        mass: 1
  # Default-off pre-release GRPO coefficient-opportunity audit.
  gradient_opportunity_audit:
    enabled: false
    output_path: null
    observer_duty_path: null
  # Default-off behavior-neutral OARS proposal observer. This requires the
  # weight_fifo sampler, four prompts per train step, and the opportunity audit.
  opportunity_at_risk_shadow:
    enabled: false
    output_path: null
    service_budget_multiplier: 1.02
    max_candidate_groups: 25
  # Default-off, behavior-neutral OARS-v2 observer. It compares eager FIFO
  # with age, reward-variance, normalized-M4, and absolute-M4 proposals on
  # naturally available choice sets under a two-sided token band.
  opportunity_at_risk_v2_shadow:
    enabled: false
    # Required and distinct from lifecycle/opportunity/duty paths when enabled.
    output_path: null
    # natural_eager requires no FIFO watermark. controlled_frontier is an
    # explicit experimental regime and requires a watermark greater than four.
    candidate_window_policy: natural_eager
    # Proposals must stay within 98%--102% of the FIFO batch's valid tokens.
    minimum_service_multiplier: 0.98
    maximum_service_multiplier: 1.02
    # Larger natural ready sets record an explicit FIFO safety fallback.
    max_candidate_groups: 64
    # Larger sets are safely pruned before fixed-cardinality enumeration.
    exact_search_max_candidates: 16
    # Each scorer independently falls back to FIFO after five milliseconds.
    decision_time_budget_ns: 5000000
  # Default-off, non-resumable weights/resolved-config export performed only
  # after the configured terminal train-step/version boundary is reached.
  terminal_policy_export:
    enabled: false
    output_dir: null

# SC does not support checkpointing yet.
checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-single-controller

policy:
  dtensor_cfg:
    enabled: false
  megatron_cfg:
    enabled: true

  generation:
    port_range_low: 11001
    port_range_high: 15000
    mcore_generation_config:
      unified_memory_level: 0
    vllm_cfg:
      async_engine: true
    colocated:
      enabled: false
      resources:
        gpus_per_node: 1
        num_nodes: 1

logger:
  wandb:
    name: grpo-single-controller-dev
  swanlab:
    name: grpo-single-controller-dev
  mlflow:
    run_name: grpo-single-controller-dev

data_plane:
  enabled: true

cluster:
  gpus_per_node: 2
  master_port_range_low: 25000
  master_port_range_high: 28000
