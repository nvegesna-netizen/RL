# Prospective paired third-workload M4 generalization cell. The only model-axis
# delta from its 1.7B pair is model/tokenizer identity and output identity.
defaults: grpo_math_1B_megatron_single_controller_m4_qwen3_1p7b_numinamath_generalization.yaml

policy:
  model_name: Qwen/Qwen3-0.6B
  tokenizer:
    name: Qwen/Qwen3-0.6B

async_rl:
  lifecycle_audit_path: results/m4-qwen3-0p6b-numinamath-generalization/lifecycle.jsonl
  controlled_release_delay:
    seed: 20260925
    assignment_domain: m4-opportunity-loss-qwen3-0p6b-numinamath-generalization-v1
  gradient_opportunity_audit:
    output_path: results/m4-qwen3-0p6b-numinamath-generalization/opportunity.jsonl
    observer_duty_path: results/m4-qwen3-0p6b-numinamath-generalization/observer-duty.json

logger:
  log_dir: results/m4-qwen3-0p6b-numinamath-generalization/metrics
